name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      bundle_r:
        description: "Bundle runtime R dan package agar EXE mandiri"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup R for self-contained build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_r }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Copy R runtime
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_r }}
        shell: pwsh
        run: |
          $rHome = (& Rscript -e "cat(normalizePath(R.home(), winslash='/'))")
          Write-Host "R_HOME=$rHome"
          if (Test-Path vendor/R) { Remove-Item vendor/R -Recurse -Force }
          New-Item -ItemType Directory -Path vendor/R | Out-Null
          Copy-Item "$rHome/*" vendor/R -Recurse -Force

      - name: Install bundled R packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_r }}
        shell: pwsh
        run: |
          & "vendor/R/bin/Rscript.exe" scripts/install_runtime_packages.R "vendor/R/library"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Electron dependencies
        run: npm install

      - name: Verify project files
        run: node scripts/verify_project.js

      - name: Build Windows portable and installer
        run: npm run dist

      - name: Verify packaged backend and runtime
        run: node scripts/verify_packaged_resources.js

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sawitheight-r-windows-${{ github.event_name == 'workflow_dispatch' && inputs.bundle_r && 'self-contained' || 'system-r' }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.exe `
            --generate-notes `
            --title "SawitHeight R ${{ github.ref_name }}"
